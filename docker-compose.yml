version: '3.8'

services:
  www:
    container_name: php-apache
    build:
      context: ./      # Carpeta donde está tu Dockerfile
      dockerfile: Dockerfile
    depends_on:
      - db
    volumes:
      - ./:/var/www/html/  # Código fuente
    ports:
      - 90:80
    restart: always   # Reinicia automáticamente si se cae

  db:
    container_name: db
    image: mysql:9.0
    restart: always
    command: --default-authentication-plugin=mysql_native_password  # Añade esto para compatibilidad
    environment:
      MYSQL_ROOT_PASSWORD: clave
      MYSQL_DATABASE: prueba
      MYSQL_USER: user
      MYSQL_PASSWORD: test
    ports:
      - "3309:3306"
    volumes:
      - ./db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: pma
    ports:
      - '91:80'
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306  # Asegúrate de que use el puerto INTERNO (3306), no el 3309
      PMA_ARBITRARY: 1 # Esto te permite cambiar el host en la pantalla de login si fuera necesario
    depends_on:
      - db